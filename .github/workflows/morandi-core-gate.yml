name: Morandi-Core Consequence Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morandi-core-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Cook-Levin History Gate (Reject WIP / provisional commits)
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          msg = subprocess.check_output(["git", "log", "-1", "--pretty=%B"], text=True).strip()
          forbidden = re.compile(r"(?i)\b(wip|fix typo|testing again|temp commit|quick fix)\b")
          if forbidden.search(msg) or len(msg) < 12:
              print("COOK_LEVIN_HISTORY_GATE=KILL (0.00 V DC)")
              print(f"Rejected provisional commit message: {msg!r}")
              sys.exit(1)
          print("COOK_LEVIN_HISTORY_GATE=PASS")
          PY

      - name: Pull Request Realization Contract Gate (Omega)
        if: github.event_name == 'pull_request'
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          with open(os.environ["EVENT_PATH"], "r", encoding="utf-8") as f:
              ev = json.load(f)
          body = (ev.get("pull_request") or {}).get("body") or ""
          required_sections = [
              "## I. Operasjonelt Sammendrag",
              "## II. Aksiomatisk Suverenitet",
              "## III. Fail-Closed",
              "## IV. Romlig Krystallisering",
              "## V. Utstedelse av Vitne",
          ]
          missing = [s for s in required_sections if s not in body]
          unchecked = re.findall(r"^- \[ \]", body, flags=re.MULTILINE)
          has_sha256 = bool(re.search(r"\b[0-9a-fA-F]{64}\b", body))
          if missing or unchecked or not has_sha256:
              print("PR_REALIZATION_CONTRACT_GATE=KILL (0.00 V DC)")
              if missing:
                  print(f"- Missing contract sections: {missing}")
              if unchecked:
                  print(f"- Unchecked mandatory axioms: {len(unchecked)} remaining")
              if not has_sha256:
                  print("- Missing 64-hex SHA-256 Witness (W^2) in Section V")
              sys.exit(1)
          print("PR_REALIZATION_CONTRACT_GATE=PASS")
          PY

      - name: Verify Clean (0,0) Portal Surface & Zero Leaks
        run: |
          python3 - <<'PY'
          import pathlib, sys
          req = ("README.md", "LICENSE", "NOTICE", "CONTRIBUTING.md")
          missing = [p for p in req if not pathlib.Path(p).is_file()]
          if missing:
              print(f"PORTAL_SURFACE_GATE=KILL (missing {missing})")
              sys.exit(1)
          bad = ("/home/" + "sololyset", "Gemini" + "-Core", "03_" + "ENGINES", "05_" + "PATENTS", "07_" + "BOKHYLLA", "09_" + "SYSTEM", "CARBON" + "/")
          for p in sorted(pathlib.Path(".").rglob("*")):
              if ".git" in p.parts or not p.is_file() or p.suffix.lower() in {".svg", ".png", ".jpg"}:
                  continue
              if p.as_posix().startswith(".github/workflows/"):
                  continue
              txt = p.read_text(encoding="utf-8")
              hits = [b for b in bad if b in txt]
              if hits:
                  print(f"PORTAL_SURFACE_GATE=KILL (leak {hits} in {p})")
                  sys.exit(1)
          print("PORTAL_SURFACE_GATE=PASS (0.00 V DC)")
          PY
