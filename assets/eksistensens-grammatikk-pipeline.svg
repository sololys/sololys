<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">EKSISTENSENS GRAMMATIKK — The Grammar of Existence (Φ → Πₖ → D(E₁,E₂) → Ω → W)</title>
  <desc id="desc">Architectural schematic of the five deterministic laws separating candidate generation from realized physical consequence.</desc>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161925" stroke-width="1"/>
    </pattern>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29f0d0" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#29f0d0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd83d" stop-opacity="1.0"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="1200" height="370" rx="22" fill="#0a0b0f"/>
  <rect x="12" y="12" width="1176" height="346" rx="16" fill="url(#grid)" stroke="#1e2436" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <text x="42" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="900" fill="#f7f7f2" letter-spacing="1.5">EKSISTENSENS GRAMMATIKK // THE GRAMMAR OF EXISTENCE</text>
  <text x="1158" y="48" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#29f0d0">GENERATION ≠ AUTHORIZATION ≠ WITNESSED CONSEQUENCE</text>
  <line x1="42" y1="62" x2="1158" y2="62" stroke="#232a3d" stroke-width="1.5"/>

  <!-- ==================== STAGE 1: Φ CANDIDATE FIELD (BANE) ==================== -->
  <rect x="42" y="82" width="190" height="205" rx="12" fill="#0f121b" stroke="#2b334a" stroke-width="1.5"/>
  <text x="58" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#b9bec9">01 // BANE</text>
  <text x="58" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="900" fill="#f7f7f2">Φ CANDIDATE</text>

  <!-- Speculative paths emerging from origin -->
  <path d="M 68 190 C 125 190, 155 110, 290 102" fill="none" stroke="#ff3ca6" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M 68 190 C 135 190, 165 255, 290 250" fill="none" stroke="#ffd83d" stroke-width="2.5" stroke-dasharray="4 7"/>
  <path d="M 68 190 L 300 190" fill="none" stroke="#29f0d0" stroke-width="4.5"/>
  <circle cx="68" cy="190" r="9" fill="#f7f7f2"/>

  <text x="58" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8e96aa">Unbound hypothesis</text>
  <text x="58" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ff3ca6">Zero physical authority</text>

  <!-- ==================== STAGE 2: Πₖ ORTHOGONAL PROJECTION ==================== -->
  <rect x="268" y="82" width="205" height="205" rx="12" fill="#0f121b" stroke="#29f0d0" stroke-width="1.8"/>
  <text x="284" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#29f0d0">02 // POINCARÉ Σ</text>
  <text x="284" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="900" fill="#f7f7f2">Πₖ PROJECTION</text>

  <!-- Orthogonal Mirror Plane Sigma -->
  <line x1="368" y1="138" x2="368" y2="238" stroke="#29f0d0" stroke-width="3.5"/>
  <rect x="368" y="176" width="12" height="12" fill="none" stroke="#29f0d0" stroke-width="1.5"/>
  <!-- Deflected oblique ray (P != P†) -->
  <path d="M 290 102 L 365 152 L 325 130" fill="none" stroke="#ff3ca6" stroke-width="2.5"/>
  <circle cx="365" cy="152" r="4.5" fill="#ff3ca6"/>
  <text x="380" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ff3ca6">P ≠ P† REJECT</text>

  <!-- Orthogonal admitted ray (P = P†) -->
  <line x1="300" y1="190" x2="508" y2="190" stroke="#29f0d0" stroke-width="4.5"/>
  <circle cx="368" cy="190" r="6" fill="#29f0d0"/>
  <text x="380" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#29f0d0">P = P† ISOMETRY</text>

  <text x="284" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8e96aa">R = 2P − I · ρ(DP_Σ) = 1</text>
  <text x="284" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#29f0d0">Δ_K ≤ ε_tol verified</text>

  <!-- ==================== STAGE 3: CAUSAL DIAMOND & INVOLUTION ==================== -->
  <rect x="508" y="82" width="205" height="205" rx="12" fill="#0f121b" stroke="#2b334a" stroke-width="1.5"/>
  <text x="524" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#ffd83d">03 // INVARIANCE</text>
  <text x="524" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="900" fill="#f7f7f2">D(E₁, E₂) CONE</text>

  <!-- Causal Diamond polygon -->
  <polygon points="555,190 610,145 665,190 610,235" fill="#131c2b" stroke="#ffd83d" stroke-width="2.2"/>
  <line x1="508" y1="190" x2="748" y2="190" stroke="#29f0d0" stroke-width="4.5"/>
  <circle cx="555" cy="190" r="4.5" fill="#ffd83d"/>
  <circle cx="665" cy="190" r="4.5" fill="#ffd83d"/>
  <text x="610" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="800" fill="#ffd83d">ds² ≤ 0</text>
  <text x="610" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f7f7f2">U⁻¹U(s) = s</text>

  <text x="524" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8e96aa">Noether closure ΔJ = 0</text>
  <text x="524" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ffd83d">Passive bound Ḣ ≤ 0</text>

  <!-- ==================== STAGE 4: Ω GALVANIC GATE (PUNKT) ==================== -->
  <rect x="748" y="82" width="195" height="205" rx="12" fill="#0f121b" stroke="#ff3ca6" stroke-width="1.8"/>
  <text x="764" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#ff3ca6">04 // PUNKT</text>
  <text x="764" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="900" fill="#f7f7f2">Ω CONSEQUENCE</text>

  <!-- Galvanic Gate Box -->
  <rect x="795" y="158" width="102" height="64" rx="10" fill="#f7f7f2"/>
  <text x="846" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="900" fill="#0a0b0f">Ω GATE</text>
  <text x="846" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="800" fill="#0a0b0f">OPEN / KILL</text>

  <line x1="748" y1="190" x2="795" y2="190" stroke="#29f0d0" stroke-width="4.5"/>
  <line x1="897" y1="190" x2="978" y2="190" stroke="#ffd83d" stroke-width="5"/>

  <text x="764" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#29f0d0">OPEN: 5.00 V DC Commit</text>
  <text x="764" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ff3ca6">KILL: 0.00 V DC Clamp</text>

  <!-- ==================== STAGE 5: W WITNESS & LANDAUER TAX ==================== -->
  <rect x="978" y="82" width="180" height="205" rx="12" fill="#0f121b" stroke="#ffd83d" stroke-width="1.8"/>
  <text x="994" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#ffd83d">05 // SEALED</text>
  <text x="994" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="900" fill="#f7f7f2">W WITNESS</text>

  <!-- Sealed Witness Node -->
  <circle cx="1068" cy="190" r="24" fill="#161b28" stroke="#ffd83d" stroke-width="3"/>
  <circle cx="1068" cy="190" r="9" fill="#ffd83d"/>
  <line x1="978" y1="190" x2="1044" y2="190" stroke="#ffd83d" stroke-width="5"/>

  <text x="994" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8e96aa">Append-only SHA-256</text>
  <text x="994" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ffd83d">Q = N k_B T ln 2</text>

  <!-- Bottom Axiom Footer -->
  <rect x="42" y="304" width="1116" height="38" rx="8" fill="#101420" stroke="#232a3d" stroke-width="1"/>
  <text x="600" y="328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#f7f7f2">
    DYNAMIKKEN FORESLÅR (Φ)  ·  STRUKTUREN PROJISERER (Πₖ)  ·  MASKINVAREN TILLATER (Ω)  ·  HISTORIEN FORSEGLER (W)
  </text>
</svg>
